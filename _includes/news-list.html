{%- capture site_link -%}]({{ site.baseurl }}/{%- endcapture -%}
{%- assign lim = include.limit | default: 1000 -%}
<ul class="news">
  {% for item in site.data.news limit: lim %}
  <li>
    <span class="news-date">{{ item.date }}</span>
    <span class="news-text">{{ item.text | replace: "](/", site_link | markdownify | remove: "<p>" | remove: "</p>" }}</span>
  </li>
  {% endfor %}
</ul>
