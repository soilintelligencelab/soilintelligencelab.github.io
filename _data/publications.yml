- year: 2026
  authors: Tao, F.*, Houlton, B.Z.
  title: "Optimizing carbon dioxide removal in agricultural soils: A new mechanistic model of enhanced rock weathering"
  venue: Journal of Advances in Modeling Earth Systems
  details: (accepted)
  selected: true
  summary: "COUSINE couples soil organic and inorganic carbon to quantify CO₂ removal by enhanced rock weathering. Validated against a field trial in the US Corn Belt, it shows how clay and organic acids, nitrogen fertiliser and climate limit how much CO₂ is removed in situ, and how fast."

