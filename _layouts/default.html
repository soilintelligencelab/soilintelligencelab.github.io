<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} — {% endif %}{{ site.title }} | {{ site.institution }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  {% capture icon_v %}?v={{ site.time | date: '%s' }}{% endcapture %}
  <link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}{{ icon_v }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/assets/img/mark.png' | relative_url }}{{ icon_v }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  {% include header.html %}
  <main id="content">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
